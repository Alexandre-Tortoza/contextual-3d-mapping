[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "point-representation"
version = "0.1.0"
description = "Learned 3D point representations from LiDAR point clouds."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/point_representation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["../../contracts"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["point_representation"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["contextual_mapping_contracts.*"]
ignore_missing_imports = true
