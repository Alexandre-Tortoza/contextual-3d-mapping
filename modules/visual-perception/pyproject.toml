[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visual-perception"
version = "0.1.0"
description = "Structured visual and semantic observations from RGB images."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]
# Reserved for the real backend adapters selected by issue #174 (#186-#189).
# No heavyweight ML dependency is declared yet: this environment has no GPU,
# and every canonical stage defaults to its GPU-free fake (see config.py).
ml = []

[tool.hatch.build.targets.wheel]
packages = ["src/visual_perception"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# `contextual_mapping_contracts` (#99/#100/#101) and, for the integration
# tests only, `contextual_mapping_adapters`/`contextual_mapping_datasets`
# (#103/#104) do not have their own installable package yet. Until they do,
# tests resolve them from their source trees directly.
pythonpath = ["../../contracts", "../../adapters/datasets", "../../datasets"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["visual_perception"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["contextual_mapping_contracts.*", "contextual_mapping_adapters.*", "contextual_mapping_datasets.*"]
ignore_missing_imports = true
