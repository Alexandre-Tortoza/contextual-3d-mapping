[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visual-perception"
version = "0.1.0"
description = "Structured visual and semantic observations from RGB images."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]
# Real backend adapters selected by issue #174 (#186-#189), benchmarked on the
# reference RTX 3060 8GB GPU. The dataclass defaults in config.py stay "fake";
# these deps are only exercised when a caller opts into a real backend/checkpoint.
ml = [
    "torch>=2.4",
    "transformers>=4.47",
    "accelerate>=1.0",
    "pillow>=10",
    "safetensors>=0.4",
    "qwen-vl-utils>=0.0.8",
    "bitsandbytes>=0.44",
    "ultralytics>=8.3",
    "scipy>=1.13",
    "sentencepiece>=0.2",
    "protobuf>=4",
]
# Local benchmark/validation data prep only (e.g. prepare_corridor02_frames.py).
# Unrelated to inference; kept separate from `ml` on purpose.
bench = [
    "rosbags>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/visual_perception"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# `contextual_mapping_contracts` (#99/#100/#101) and, for the integration
# tests only, `contextual_mapping_adapters`/`contextual_mapping_datasets`
# (#103/#104) do not have their own installable package yet. Until they do,
# tests resolve them from their source trees directly.
pythonpath = ["../../contracts", "../../adapters/datasets", "../../datasets"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["visual_perception"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["contextual_mapping_contracts.*", "contextual_mapping_adapters.*", "contextual_mapping_datasets.*"]
ignore_missing_imports = true
