common:
    lid_topic: "/velodyne_points"
    imu_topic: "/imu/data"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 2
    scan_line: 16
    scan_rate: 10
    # O campo `time` do PointCloud2 está em segundos neste dataset.
    timestamp_unit: 0
    blind: 2.0

mapping:
    # Ruídos e extrínseca vêm de corridor-02-extrinsics.yaml.
    acc_cov: 0.08
    gyr_cov: 0.004
    b_acc_cov: 0.00004
    b_gyr_cov: 0.000002
    fov_degree: 180
    det_range: 100.0
    extrinsic_est_en: false
    extrinsic_T: [0.0, 0.0, 0.0]
    extrinsic_R: [
        0.999954875339377, 0.0, 0.009499857104811,
        0.0, 1.0, 0.0,
        -0.009499857104811, 0.0, 0.999954875339377,
    ]

publish:
    path_en: true
    scan_publish_en: true
    dense_publish_en: false
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: true
    interval: -1
