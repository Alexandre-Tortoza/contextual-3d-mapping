[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-map"
version = "0.1.0"
description = "Persistent consolidation of contextual map evidence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../semantic-fusion/src", "../../contracts"]
