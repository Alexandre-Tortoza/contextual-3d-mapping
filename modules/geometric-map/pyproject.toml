[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geometric-map"
version = "0.1.0"
description = "Persistent world geometry from motion-corrected LiDAR."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/geometric_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../../contracts", "../../state-estimation/src"]
