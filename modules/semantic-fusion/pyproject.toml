[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-fusion"
version = "0.1.0"
description = "Multi-observation semantic fusion anchored on persistent geometry."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../../contracts"]
