[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "query-engine"
version = "0.1.0"
description = "Capability-aware map query contracts and routing."
requires-python = ">=3.12"
dependencies = ["semantic-memory"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/query_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../semantic-memory/src"]
