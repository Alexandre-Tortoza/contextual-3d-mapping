[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensor-association"
version = "0.1.0"
description = "Calibrated RGB LiDAR point association."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/sensor_association"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../../contracts", "../../geometric-map/src"]
