[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapping-runtime"
version = "0.1.0"
description = "Offline composition for RGB LiDAR map slices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mapping-runtime = "mapping_runtime.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
context = ["numpy>=1.26", "pillow>=10", "pyyaml>=6", "rosbags>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/mapping_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../../contracts",
    "../../modules/state-estimation/src",
    "../../modules/geometric-map/src",
    "../../modules/sensor-association/src",
]
