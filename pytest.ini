# Configuração de teste de nível de repositório.
#
# Cada área do repositório é dona dos seus próprios testes (ver AGENTS.md
# "Papéis do repositório"), mas nenhuma delas é instalada como pacote durante
# o desenvolvimento local. Este arquivo declara, em um único lugar, onde os
# testes vivem e quais raízes precisam estar no import path, para que
# `pytest` na raiz rode o repositório inteiro.
#
# NOTE: `modules/visual-perception` mantém a própria configuração em seu
# `pyproject.toml`; rodar pytest de dentro do módulo continua usando aquela.
[pytest]
testpaths =
    adapters/datasets/tests
    datasets/tests
    evaluation/tests
    experiments/tests
    modules/visual-perception/benchmarks
    modules/visual-perception/tests
    tests
pythonpath =
    contracts
    datasets
    adapters/datasets
    evaluation
    experiments
    modules/visual-perception/src
addopts = -ra
